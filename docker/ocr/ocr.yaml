# Pipeline OCR do PaddleX/PaddleOCR 3.x com o reconhecedor latino do PP-OCRv5 (cobre português).
# Gerado a partir de `paddleocr ocr --get_pipeline_config OCR` e ajustado. Os modelos são baixados
# na primeira subida (mantenha o volume /root/.paddlex para não baixar de novo).
pipeline_name: OCR
text_type: general
use_doc_preprocessor: true
use_textline_orientation: true
SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    use_doc_orientation_classify: true
    use_doc_unwarping: false
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
SubModules:
  TextDetection:
    module_name: text_detection
    model_name: PP-OCRv5_mobile_det
    model_dir: null
    limit_side_len: 960
    limit_type: max
    thresh: 0.3
    box_thresh: 0.6
    unclip_ratio: 1.5
  TextLineOrientation:
    module_name: textline_orientation
    model_name: PP-LCNet_x1_0_textline_ori
    model_dir: null
    batch_size: 6
  TextRecognition:
    module_name: text_recognition
    model_name: latin_PP-OCRv5_mobile_rec
    model_dir: null
    batch_size: 6
    score_thresh: 0.0
