<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · ReformAI</title><link rel="stylesheet" href="assets/app.css"></head>
<body>
<div class="auth">
  <div class="card">
    <div class="card-body" style="padding:28px">
      <div class="brand" style="padding:0;margin-bottom:22px"><div class="brand-mark">R</div>ReformAI</div>
      <h1>Entrar</h1>
      <p class="muted" style="margin:4px 0 20px">Acompanhe e autorize reformas no seu condomínio.</p>
      <form class="stack" style="gap:14px" onsubmit="event.preventDefault();location.href='03-morador-obras.html'">
        <div class="field"><label for="e">E-mail</label><input id="e" class="input" type="email" placeholder="voce@email.com" value="morador@demo.com"></div>
        <div class="field">
          <div class="spread"><label for="p">Senha</label><a href="#" class="small muted">Esqueci a senha</a></div>
          <input id="p" class="input" type="password" value="senha123">
        </div>
        <button class="btn btn-primary" style="width:100%;height:40px">Entrar</button>
      </form>
      <div class="divider" style="margin:20px 0"></div>
      <p class="small muted">É morador e ainda não tem conta? Use o <strong>QR code ou link</strong> que o síndico divulgou no condomínio.</p>
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
</body></html>
